<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1958d1"><title>部品室 · オフライン</title><style>body{font:16px/1.7 Arial,sans-serif;background:#f4f6fa;color:#17243a;margin:0;padding:30px 20px}main{max-width:850px;margin:auto}h1{font-size:27px}p{color:#637088}button{background:#1958d1;color:#fff;border:0;border-radius:7px;padding:12px 22px;font-size:16px}table{width:100%;border-collapse:collapse;background:white;margin:25px 0}td,th{text-align:left;padding:13px;border-bottom:1px solid #dfe5ef;overflow-wrap:anywhere}small{font-size:13px;color:#687991}.empty{background:white;padding:24px;border-radius:10px}</style><main><h1>部品室</h1><p>オフラインです。保存済みの在庫を表示しています。記録はインターネット接続後に行ってください。</p><small id="time"></small><div id="stock"></div><button onclick="location.reload()">接続を再確認</button></main><script>try{const mode=JSON.parse(localStorage.getItem('parts-stock-v1-mode')||'"setup"');const data=JSON.parse(localStorage.getItem('parts-stock-v1-'+mode)||'{"parts":[]}');const area=document.getElementById('stock');document.getElementById('time').textContent=(mode==='demo'?'お試しデータ / ':'')+(data.updatedAt?'最終取得：'+new Date(data.updatedAt).toLocaleString('ja-JP'):'');if(data.parts.length){const table=document.createElement('table');const header=table.insertRow();['部品名','在庫','必要在庫'].forEach(v=>{const th=document.createElement('th');th.textContent=v;header.append(th)});data.parts.forEach(p=>{const row=table.insertRow();[p.name,p.quantity+' '+p.unit,p.minimum+' '+p.unit].forEach(v=>row.insertCell().textContent=v)});area.append(table);}else{area.textContent='保存済みの部品はありません。';area.className='empty';}}catch{document.getElementById('stock').textContent='保存データを読み取れませんでした。'}</script></html>
